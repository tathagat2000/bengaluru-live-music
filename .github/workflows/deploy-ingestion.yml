name: Deploy Bengaluru ingestion worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'migrations/**'
      - 'wrangler.ingestion.jsonc'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:pipeline
      - run: npx wrangler deploy --config wrangler.ingestion.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
