name: Review event candidates with Codex

on:
  repository_dispatch:
    types: [bengaluru-review]

permissions:
  contents: read

# Serialize reviews so renewable OAuth refresh tokens are never rotated concurrently.
concurrency:
  group: bengaluru-codex-review
  cancel-in-progress: false

jobs:
  review:
    # This persistent runner owns the protected ChatGPT-plan OAuth credentials.
    runs-on: [self-hosted, codex-plan]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/codex-review.mjs
        env:
          CODEX_CREDENTIALS_FILE: ${{ vars.CODEX_CREDENTIALS_FILE }}
          CODEX_BIN: ${{ vars.CODEX_BIN }}
          CODEX_MODEL_ID: ${{ vars.CODEX_MODEL_ID }}
          INGESTION_API_URL: ${{ vars.INGESTION_API_URL }}
          INGESTION_SHARED_SECRET: ${{ secrets.INGESTION_SHARED_SECRET }}
          INGESTION_RUN_ID: ${{ github.event.client_payload.runId }}
          INGESTION_BATCH_ID: ${{ github.event.client_payload.batchId }}
